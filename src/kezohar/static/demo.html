<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כזוהר הרקיע — סוכן תורני</title>
<style>
:root{color-scheme:light;--navy:#112e45;--gold:#ba934e;--paper:#faf8f2;--border:#ded9cd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:17px/1.65 system-ui,-apple-system,sans-serif}header{background:var(--navy);color:white;padding:26px max(20px,calc((100% - 1000px)/2))}header small{color:#dac394}h1{margin:0;font-size:30px}main{max-width:1000px;margin:auto;padding:28px 18px}.card{background:white;border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 5px 20px #102e4506}label{display:block;font-weight:650}textarea{width:100%;font:inherit;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:14px;margin:10px 0;min-height:105px}button,select{font:inherit;border-radius:9px;padding:9px 16px;border:1px solid var(--border);cursor:pointer;background:white;color:var(--navy)}button.primary{background:var(--navy);color:white;border:0}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.muted{color:#627280;font-size:14px}.badge{background:#f4ecd8;padding:4px 12px;border-radius:20px;font-size:14px}.answer{white-space:pre-wrap;font-size:20px;margin:16px 0}.source{border-top:1px solid var(--border);padding:16px 0}.source p{margin:6px 0;white-space:pre-wrap}.samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.samples button{font-size:14px;padding:6px 10px}dialog{max-width:850px;width:90%;max-height:85vh;border:1px solid var(--border);border-radius:18px;padding:24px;color:var(--navy)}dialog::backdrop{background:#102e4580}#sourceText{white-space:pre-wrap}#result[hidden],#clarify[hidden]{display:none}#error{color:#8a2e25}h2{font-size:22px;margin:0 0 14px}footer{font-size:14px;color:#627280;padding-bottom:24px}.clarification{margin:14px 0}select{display:block;margin-top:6px;max-width:100%}
</style></head><body><header><small>הדגמה פרטית · הספרייה המקומית</small><h1>כזוהר הרקיע</h1><div>סוכן תורני עם מקורות גלויים</div></header><main>
<div class="card"><div id="status" class="muted">בודק חיבור למודל ולספרייה…</div><form id="form"><label for="question">מה תרצה לברר?</label><textarea id="question" maxlength="2000" placeholder="כתוב שאלה בעברית, כולל פרטים שעשויים לשנות את הדין" required></textarea><div class="row"><button class="primary" id="submit">חפש מקורות והשב</button><span class="muted" id="progress">עד 45 שניות לבקשה · לפי פסיקת הספרדים</span></div></form><div class="samples" id="samples"></div><p id="error" role="alert"></p></div>
<section class="card" id="result" hidden aria-live="polite"><div class="row"><span class="badge" id="verdict"></span><span class="muted" id="elapsed"></span></div><div class="answer" id="answer"></div><div id="clarify" hidden></div><p class="muted" id="verification"></p><h2 id="sourcesHeading">מקורות</h2><div id="sources"></div></section>
<footer>אימות תוכנה אינו אישור הלכתי. התאמת המקור למקרה דורשת בדיקה אנושית. ההדגמה אינה שומרת זיכרון שיחות אישי ואינה מפרסמת תשובות.</footer>
</main><dialog id="sourceDialog"><button id="closeSource">סגור</button><h2 id="sourceTitle"></h2><div id="sourceMeta" class="muted"></div><p id="sourceText"></p></dialog>
<script>
const $=id=>document.getElementById(id);let facts={},ruleAnswers={},currentQuestion='',busy=false;
const examples=["צ׳יפס שטוגן בשמן שבו טוגנו שניצלים — האם צריך להמתין שש שעות?","שכחתי לומר יעלה ויבוא בראש חודש — האם חוזרים?","האם מותר לחמם בשבת מרק שהתקרר?","מה מברכים על אגוז פקאן?","האם מותר לדבר בין תפילין של יד לתפילין של ראש?"];
const labels={rule_needs_clarification:'כלל מאומת · חסר פרט למקרה',ok:'עבר אימות תוכנה · נדרשת בדיקה הלכתית',needs_clarification:'נדרשים פרטים נוספים',no_source:'לא נמצא בסיס מספיק',unsupported:'התשובה לא עברה אימות',invalid_citation:'הציטוט לא אומת',review_required:'נדרשת בדיקה נוספת',insufficient_context:'אין תמיכה מספקת למקרה',partial_search:'חיפוש חלקי · אין תשובה מאומתת',budget_exhausted:'חריגה מזמן הבקשה',irrelevant:'המקור אינו מתאים למקרה', 'rag-scope-pending':'הרשאת השימוש דורשת בירור'};
for(const q of examples){const b=document.createElement('button');b.textContent=q;b.onclick=()=>{if(busy)return;$('question').value=q;facts={};ruleAnswers={};$('result').hidden=true};$('samples').append(b)}
async function api(path,options={}){const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw Error(d.error||'הבקשה נכשלה');return d}
async function openSource(s){$('sourceTitle').textContent=s.work_title||'מקור';$('sourceText').textContent='טוען את המקור ובודק הרשאות…';$('sourceMeta').textContent='';$('sourceDialog').showModal();try{const d=await api('/api/sources/'+encodeURIComponent(s.source_id));const src=d.source||d;$('sourceTitle').textContent=src.work_title||s.work_title;$('sourceMeta').textContent=[src.reference,src.author,src.version].filter(Boolean).join(' · ');$('sourceText').textContent=src.text||'אין טקסט מורשה לתצוגה.'}catch(e){$('sourceText').textContent=e.message}}
function render(d){$('result').hidden=false;$('verdict').textContent=labels[d.verdict]||'לא התקבל אישור לתשובה';$('elapsed').textContent=`${d.demo_elapsed_s} שניות · פניות למודל: ${d.demo_model_calls}`;$('answer').textContent=d.answer||'לא התקבלה תשובה.';$('verification').textContent=d.verification?.verdict==='ok'?(d.verification.support==='source-selection-whole-unit-reading'?'המודל בחר מקור; הטקסט המלא, הזהות וההרשאות נבדקו מול המאגר. התאמת הדין למקרה עדיין דורשת בדיקה הלכתית.':'הציטוט/הניסוח התחום עברו בדיקות תוכנה. לא ניתן אישור הלכתי אנושי.'):'לא הוכחה תמיכה מספקת למסקנה הלכתית. מקורות החיפוש מוצגים לעיון בלבד.';if(d.answer_status)$('verification').textContent+=' '+d.answer_status.message;if(d.search_status?.partial)$('verification').textContent+=' החיפוש חלקי; חלק מהמקורות או שלבי החיפוש לא הושלמו.';
$('sources').replaceChildren();const approved=new Map((d.structured_answer?.quotations||[]).map(q=>[q.source_id,q.text]));const ss=[...(d.sources||[])].sort((a,b)=>Number(approved.has(b.source_id))-Number(approved.has(a.source_id)));$('sourcesHeading').textContent=ss.length?'מקורות שנמצאו':'לא הוצגו מקורות';for(const s of ss){const box=document.createElement('div');box.className='source';const title=document.createElement('strong');title.textContent=[s.work_title,s.reference].filter(Boolean).join(' — ');const meta=document.createElement('div');meta.className='muted';meta.textContent=[s.author,s.version,s.authority_profile?.embedded_other_views?'המקטע כולל הגה או אזכור דעות נוספות; אין לייחס את כולו למחבר הספר':'',approved.has(s.source_id)?'ציטוט שעבר אימות תוכנה':'מועמד חיפוש; אינו הוכחה לפסיקה'].filter(Boolean).join(' · ');const p=document.createElement('p');p.textContent=approved.get(s.source_id)||((s.text||'').slice(0,450)+((s.text||'').length>450?'…':''));const b=document.createElement('button');b.textContent='פתח טקסט מקור';b.onclick=()=>openSource(s);box.append(title,meta,p,b);$('sources').append(box)}
$('clarify').replaceChildren();$('clarify').hidden=!(d.clarifications||[]).length;for(const c of d.clarifications||[]){const label=document.createElement('label');label.className='clarification';label.textContent=c.question;const select=document.createElement('select');const empty=document.createElement('option');empty.value='';empty.textContent='בחר פרט מתאים';select.append(empty);for(const opt of c.options){const o=document.createElement('option');o.value=opt.value;o.textContent=opt.label;select.append(o)}const answers=c.kind==='source-condition'?ruleAnswers:facts;select.value=answers[c.field]||'';select.onchange=()=>{if(select.value)answers[c.field]=select.value;else delete answers[c.field]};label.append(select);$('clarify').append(label)}if(d.clarifications?.length){const b=document.createElement('button');b.className='primary';b.textContent='המשך עם הפרטים שבחרתי';b.onclick=()=>ask();$('clarify').append(b)}}
async function ask(){if(busy)return;const q=$('question').value.trim();if(!q)return;if(q!==currentQuestion){facts={};ruleAnswers={};currentQuestion=q}busy=true;$('submit').disabled=true;$('error').textContent='';const start=performance.now();const timer=setInterval(()=>{$('progress').textContent=`מחפש ומאמת… ${((performance.now()-start)/1000).toFixed(1)} שניות`},200);try{render(await api('/demo/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,circumstances:facts,rule_answers:ruleAnswers,top_k:5})}))}catch(e){$('error').textContent=e.message}finally{clearInterval(timer);busy=false;$('submit').disabled=false;$('progress').textContent='עד 45 שניות לבקשה · לפי פסיקת הספרדים'}}
$('form').onsubmit=e=>{e.preventDefault();ask()};$('question').oninput=()=>{facts={};ruleAnswers={};$('clarify').hidden=true};$('closeSource').onclick=()=>$('sourceDialog').close();
api('/demo/status').then(d=>{$('status').textContent=d.available?`מחובר למודל המקומי ${d.model} · הספרייה זמינה`:`המודל אינו זמין (${d.error}). יש להפעיל את שרת LM Studio הקיים; לא הוצגו תשובות מדומות.`}).catch(e=>{$('status').textContent='תקלה בחיבור: '+e.message});
</script></body></html>
